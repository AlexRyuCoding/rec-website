# The Google Cloud side in miniature, on this computer: Postgres and
# PostgREST as they run there (same versions, same PostgREST settings).
# Made-up data only. Everything listens on 127.0.0.1.
#
# Used by `npm run test:rest` (scripts/test-rest.sh), which sets the two
# values below to random ones and throws the whole stack away afterwards.
# By hand, from the repository root:
#
#   export AUTHENTICATOR_PASSWORD=<anything made up>
#   export PGRST_JWT_SECRET=<anything made up, 32 characters or more>
#   docker compose --env-file deploy/versions.env -f deploy/local/docker-compose.yml up -d --wait db
#   docker compose --env-file deploy/versions.env -f deploy/local/docker-compose.yml \
#     exec -T -e AUTHENTICATOR_PASSWORD db bash /repo/deploy/ops/migrate.sh
#   docker compose --env-file deploy/versions.env -f deploy/local/docker-compose.yml up -d --wait rest
#
# The database is built by migrate.sh BEFORE PostgREST starts: PostgREST
# logs in as "authenticator", which migrate.sh creates.
name: rac-local

services:
  db:
    image: postgres:${POSTGRES_MAJOR:?set by deploy/versions.env}
    environment:
      POSTGRES_DB: rac
      # The administrator's password, for this throwaway database only.
      # Nothing uses it: migrate.sh runs inside the container, where the
      # administrator needs none.
      POSTGRES_PASSWORD: ${AUTHENTICATOR_PASSWORD:?a made-up value; see the top of this file}
      # What migrate.sh, run inside this container, connects as.
      PGUSER: postgres
      PGDATABASE: rac
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      # The repository's SQL and the ops scripts, as the ops image holds them.
      - ../../supabase:/repo/supabase:ro
      - ../ops:/repo/deploy/ops:ro
    healthcheck:
      # Over TCP: the image's first-run set-up server listens on a socket
      # only, and must not count as "up".
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "rac"]
      interval: 1s
      timeout: 3s
      retries: 60

  rest:
    image: postgrest/postgrest:${POSTGREST_VERSION:?set by deploy/versions.env}
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The same settings as deploy/service.template.yaml — keep them in step.
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/rac
      PGRST_DB_SCHEMAS: public
      # unaccent and pg_trgm live in "extensions" (patient search).
      PGRST_DB_EXTRA_SEARCH_PATH: public, extensions
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:?a made-up value of 32+ characters; see the top of this file}
      # Supabase's cap, which the app's paging assumes.
      PGRST_DB_MAX_ROWS: 1000
      # PGRST_DB_ANON_ROLE is deliberately NOT set: a request without a
      # valid token is refused (401) before it reaches the database.
      # The admin server answers "are you ready?" (/ready). Here it is kept
      # to the container itself, which is what lets `postgrest --ready`
      # below work; on Cloud Run the platform asks from outside the
      # container, so there this one line is left out.
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
    ports:
      - "127.0.0.1:54331:3000"
    healthcheck:
      # The image has no shell; PostgREST can ask its own admin server.
      test: ["CMD", "postgrest", "--ready"]
      interval: 1s
      timeout: 3s
      retries: 60
